<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Workouts</title>
</head>
<body>


    {% if allWorkouts %}
        {% for workout in allWorkouts %}
            <li><a href="{% url 'Potential_Unleashed:detail' workout.id %} ">{{ workout }}</a></li>
        {% endfor %}
    {% else %}
        <p>No saved workouts</p>
    {% endif %}
</body>
</html>
